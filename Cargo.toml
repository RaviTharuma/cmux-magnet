[package]
name = "cmux-magnet"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Magnet-style equal pane layouts for cmux"
license = "MIT"
repository = "https://github.com/RaviTharuma/cmux-magnet"
default-run = "cmux-magnet"

[[bin]]
name = "cmux-magnet"
path = "src/main.rs"

[[bin]]
name = "cmux-magnet-sidebar"
path = "src/sidebar_main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cmux-client = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
